[project]
name = "obot-card-verify-mcp"
version = "0.1.3"
description = "STDIO MCP server that wraps the id-vision cardVerify API"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.9.0,<2",
]

[project.scripts]
obot-card-verify-mcp = "card_verify_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    ".venv",
    "verify.py",
    "dist",
    "__pycache__",
]

[tool.hatch.build.targets.wheel]
packages = ["card_verify_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "card_verify_mcp",
    "pyproject.toml",
]

[project]
name = "obot-weather-mcp"
version = "0.1.3"
description = "STDIO demo weather MCP server with hardcoded city data for Obot UVX hosting"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0,<2",
]

[project.scripts]
obot-weather-mcp = "weather_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    ".venv",
    "dist",
    "__pycache__",
    "test_mcp_stdio.py",
]

[tool.hatch.build.targets.wheel]
packages = ["weather_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "weather_mcp",
    "pyproject.toml",
]
